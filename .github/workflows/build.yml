name: Build Singularity Project

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: # Дозволяє запускати збірку вручну кнопкою

jobs:
  # --- Задача 1: Збірка Usermode Мапера (.exe) ---
  build-mapper:
    runs-on: windows-2022
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages via MSBuild
      run: |
        # Запускаємо відновлення з правильним шляхом до папки DriverMapper
        msbuild DriverMapper/DriverMapper.slnx /t:restore /p:Configuration=Release /p:Platform=x64

    - name: Build Solution
      run: |
        # Збираємо мапер за правильним шляхом
        msbuild DriverMapper/DriverMapper.slnx /p:Configuration=Release /p:Platform=x64

    - name: Upload Mapper Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Singularity-Mapper-Exe
        # Шлях до скомпільованого бінарника мапера всередині вихідної папки
        path: DriverMapper/x64/Release/mapper.exe

  # --- Задача 2: Збірка UEFI DXE Драйвера (.efi) за допомогою EDK2 ---
  build-uefi-driver:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Singularity
      uses: actions/checkout@v4
      with:
        path: singularity-repo

    - name: Install Build Dependencies
      run: |
        sudo apt-get update || true
        sudo apt-get install -y build-essential uuid-dev iasl nasm python3

    - name: Checkout EDK2 (Tianocore)
      uses: actions/checkout@v4
      with:
        repository: tianocore/edk2
        submodules: 'true'
        path: edk2

    - name: Setup EDK2 Environment & Build BaseTools
      run: |
        cd edk2
        make -C BaseTools
        . edksetup.sh

    - name: Integrate SingularityPkg into EDK2
      run: |
        cp -r singularity-repo/SingularityPkg edk2/

    - name: Build UEFI Driver (.efi)
      run: |
        cd edk2
        . edksetup.sh
        # Створюємо мапінг сумісності для нових версій EDK2, де GCC5 замінено на GCC
        sed -i 's/DEFINE GCC5_BIN_PREFIX       = \/usr\/bin\//DEFINE GCC5_BIN_PREFIX       = \/usr\/bin\/gcc-/g' Conf/tools_def.txt || true
        # Збираємо драйвер через нативний компілятор Linux
        build -p SingularityPkg/SingularityPkg.dsc -a X64 -t GCC5 -b RELEASE

    - name: Upload UEFI Driver Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Singularity-DXE-Driver
        path: edk2/Build/SingularityPkg/RELEASE_GCC5/X64/SingularityDxe.efi
