name: Build Singularity Project

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: # Дозволяє запускати збірку вручну кнопкою

jobs:
  # --- Задача 1: Збірка Usermode Мапера (.exe) ---
  build-mapper:
    runs-on: windows-2022
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages via MSBuild
      run: |
        msbuild DriverMapper/DriverMapper.slnx /t:restore /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

    - name: Build Solution
      run: |
        msbuild DriverMapper/DriverMapper.slnx /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

    - name: Upload Mapper Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Singularity-Mapper-Exe
        path: DriverMapper/build/x64/Release/mapper.exe

  # --- Задача 2: Збірка UEFI DXE Драйвера (.efi) за допомогою EDK2 ---
  build-uefi-driver:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Singularity
      uses: actions/checkout@v4
      with:
        path: singularity-repo

    - name: Install Build Dependencies
      run: |
        sudo apt-get update || true
        sudo apt-get install -y build-essential uuid-dev iasl nasm python3 gcc-multilib g++-multilib

    - name: Checkout EDK2 (Tianocore)
      uses: actions/checkout@v4
      with:
        repository: tianocore/edk2
        submodules: 'true'
        path: edk2

    - name: Setup EDK2 Environment & Build BaseTools
      run: |
        cd edk2
        make -C BaseTools
        . edksetup.sh

    - name: Integrate SingularityPkg into EDK2
      run: |
        cp -r singularity-repo/SingularityPkg edk2/

    - name: Build UEFI Driver (.efi)
      run: |
        cd edk2
        . edksetup.sh
        
        # 1. Повний фікс конфігурації: міняємо GCC5 на сучасний GCC у файлі конфігурації самого проекту
        sed -i 's/SUPPORTED_TOOL_CHAIN_TAGS  = GCC5/SUPPORTED_TOOL_CHAIN_TAGS  = GCC/g' SingularityPkg/SingularityPkg.dsc || true
        sed -i 's/GCC5/GCC/g' SingularityPkg/SingularityPkg.dsc || true
        
        # 2. Вимикаємо суворе ставлення до попереджень (-Werror), щоб дрібні нестиковки коду автора не викликали краш збірки на Linux
        sed -i 's/DEFINE GCC_ALL_CC_FLAGS            = -g -Os -fshort-wchar -fno-builtin -fno-strict-aliasing -Wall -Werror/DEFINE GCC_ALL_CC_FLAGS            = -g -Os -fshort-wchar -fno-builtin -fno-strict-aliasing -Wall -Wno-error/g' Conf/tools_def.txt || true
        
        # Запускаємо збірку з нативним сучасним компілятором системи
        build -p SingularityPkg/SingularityPkg.dsc -a X64 -t GCC -b RELEASE

    - name: Upload UEFI Driver Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Singularity-DXE-Driver
        path: edk2/Build/SingularityPkg/RELEASE_GCC/X64/SingularityDxe.efi
