name: Build Singularity Project

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: # Дозволяє запускати збірку вручну кнопкою

jobs:
  # --- Задача 1: Збірка Usermode Мапера (.exe) ---
  build-mapper:
    runs-on: windows-2022
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1

    - name: Navigate to workspace and Restore NuGet Packages
      run: |
        nuget restore DriverMapper.slnx

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      run: |
        msbuild DriverMapper.slnx /p:Configuration=Release /p:Platform=x64

    - name: Upload Mapper Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Singularity-Mapper-Exe
        path: DriverMapper/x64/Release/Mapper.exe

  # --- Задача 2: Збірка UEFI DXE Драйвера (.efi) за допомогою EDK2 ---
  build-uefi-driver:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Singularity
      uses: actions/checkout@v4
      with:
        path: singularity-repo

    - name: Install Build Dependencies
      run: |
        sudo apt-get update || true
        sudo apt-get install -y build-essential uuid-dev iasl nasm python3

    - name: Checkout EDK2 (Tianocore)
      uses: actions/checkout@v4
      with:
        repository: tianocore/edk2
        submodules: 'true'
        path: edk2

    - name: Setup EDK2 Environment & Build BaseTools
      run: |
        cd edk2
        make -C BaseTools
        . edksetup.sh

    - name: Integrate SingularityPkg into EDK2
      run: |
        cp -r singularity-repo/SingularityPkg edk2/

    - name: Build UEFI Driver (.efi)
      run: |
        cd edk2
        . edksetup.sh
        # Змінено тулчейн з GCC5 на універсальний GCC
        build -p SingularityPkg/SingularityPkg.dsc -a X64 -t GCC -b RELEASE

    - name: Upload UEFI Driver Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Singularity-DXE-Driver
        path: edk2/Build/SingularityPkg/RELEASE_GCC/X64/SingularityDxe.efi
